<style>:root {
  --loam: #1C231E; --loam-2: #26302A; --loam-3: #33403A; --line: #4A5A4E;
  --parch: #EFE3C2; --parch-dim: #B9AF94; --gold: #D9A441; --gold-hi: #F2C46A;
  --teal: #58C4B8; --danger: #E0604A; --ok: #7CC24A;
  --ember: #EE6A34; --tide: #3FA0E8; --grove: #7CC24A; --void: #A56BF0; --storm: #F4DA4A; --iron: #A9ADB3;
  --r0: #BDB6A4; --r1: #7FB7D9; --r2: #5CC9A7; --r3: #E89A4A; --r4: #F2C94C;
  --radius-s: 6px; --radius-m: 10px;
  --font-ui: "Alegreya Sans", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-display: "Grenze Gotisch", "Palatino Linotype", Palatino, Georgia, serif;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; height: 100%; overflow: hidden; background: var(--loam); color: var(--parch); font: 16px/1.35 var(--font-ui);
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#view { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.icon { width: 1.05em; height: 1.05em; vertical-align: -0.16em; flex: none; }

/* ---------- top HUD ---------- */
#hud-top { position: absolute; top: 10px; left: 10px; display: flex; gap: 8px; align-items: stretch; pointer-events: none; flex-wrap: wrap; max-width: calc(100% - 340px); }
.chip { pointer-events: auto; background: rgba(28,35,30,.88); border: 1px solid var(--line); border-radius: var(--radius-m);
  padding: 6px 12px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 17px; backdrop-filter: blur(3px); }
.chip .label { color: var(--parch-dim); font-weight: 500; font-size: 14px; }
.chip.gold { color: var(--gold-hi); }
.chip.lives.hurt { animation: hurt .5s; }
@keyframes hurt { 30% { background: rgba(224,96,74,.55); } }
#wave-chip { gap: 10px; }
#wave-chip .wname { color: var(--parch-dim); font-weight: 500; font-style: italic; }
#next-btn { background: var(--gold); color: #2A2012; border: 0; border-radius: var(--radius-s); padding: 3px 10px; font-weight: 700; font-size: 15px; }
#next-btn:hover { background: var(--gold-hi); }

/* ---------- scoreboard (multiboard) ---------- */
#board { position: absolute; top: 10px; right: 10px; width: 330px; background: rgba(28,35,30,.9); border: 1px solid var(--line);
  border-radius: var(--radius-m); overflow: hidden; font-size: 14px; }
#board .title { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--loam-3);
  font-family: var(--font-display); font-size: 19px; letter-spacing: .02em; color: var(--gold-hi); }
#board .title button { background: none; border: 0; color: var(--parch-dim); font-size: 13px; font-family: var(--font-ui); padding: 2px 4px; }
#board table { width: 100%; border-collapse: collapse; table-layout: auto; white-space: nowrap; }
#board th { text-align: right; font-weight: 500; color: var(--parch-dim); padding: 4px 5px; font-size: 12.5px; }
#board th:first-child, #board td:first-child { text-align: left; padding-left: 10px; }
#board td { text-align: right; padding: 4px 5px; font-variant-numeric: tabular-nums; }
#board td[colspan] { text-align: left; padding-bottom: 7px; }
#board tr.me td { color: var(--parch); font-weight: 700; }
#board tr.open td { color: #6F7A70; font-style: italic; }
#board.collapsed table { display: none; }
#board .short, #ov-btn .short { display: none; }

/* ---------- camera controls ---------- */
#cam { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; width: 200px; }
#minimap { width: 200px; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #1C231E; cursor: crosshair; touch-action: none; display: block; }
#cam .row button { flex: 1; }
#cam button, #cam select { background: rgba(28,35,30,.88); border: 1px solid var(--line); border-radius: var(--radius-s);
  color: var(--parch); padding: 6px 10px; font-size: 14px; min-height: 36px; }
#cam button:hover { border-color: var(--teal); }
#cam .row { display: flex; gap: 6px; }

/* ---------- bottom dock ---------- */
#dock { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 10px; align-items: stretch;
  max-width: calc(100% - 20px); }
.panel { background: rgba(28,35,30,.93); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 10px 12px; }
#roll-panel { display: flex; flex-direction: column; gap: 6px; justify-content: center; min-width: 150px; }
.big { border: 0; border-radius: var(--radius-m); padding: 10px 16px; font-weight: 800; font-size: 19px;
  background: linear-gradient(#E4B85A, #C08A2E); color: #2A2012; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.big:hover:not(:disabled) { filter: brightness(1.08); }
.big small { display: block; font-weight: 600; font-size: 13px; opacity: .8; }
button:disabled { opacity: .45; cursor: not-allowed; }
.btn { background: var(--loam-3); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 6px 10px; font-size: 14.5px;
  font-weight: 600; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--parch-dim); }
.btn.gold { border-color: #8C6A2A; color: var(--gold-hi); }
.btn.danger { color: #F0A393; }
.btn .cost { color: var(--gold-hi); font-variant-numeric: tabular-nums; }

.card { display: grid; grid-template-columns: 54px 1fr; gap: 4px 10px; align-items: center; min-width: 250px; max-width: 330px; }
.card .glyph { grid-row: span 3; width: 54px; height: 54px; border-radius: 12px; display: grid; place-items: center; border: 2px solid; }
.card .glyph svg { width: 32px; height: 32px; }
.card .name { font-weight: 800; font-size: 17px; line-height: 1.15; }
.card .meta { font-size: 13.5px; color: var(--parch-dim); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 8px; height: 8px; transform: rotate(45deg); display: inline-block; border: 1px solid currentColor; }
.pips i.on { background: currentColor; }
.ability { font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.ability.none { color: #7F8A80; font-style: italic; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.hint { font-size: 13px; color: var(--teal); margin-top: 6px; }
#sel-panel .stats { font-size: 13px; color: var(--parch-dim); font-variant-numeric: tabular-nums; }
.gamble { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--parch-dim); cursor: pointer; }
.gamble input { accent-color: var(--gold); width: 16px; height: 16px; }
.hidden { display: none !important; }

/* ---------- banners, toasts, overlays ---------- */
#banner { position: absolute; top: 11%; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s; }
#banner.show { opacity: 1; }
#banner .b1 { font-family: var(--font-display); font-size: clamp(30px, 4.6vw, 54px); color: var(--parch); text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 24px rgba(0,0,0,.5); line-height: 1; }
#banner .b2 { margin-top: 6px; font-size: 19px; color: var(--gold-hi); text-shadow: 0 2px 4px rgba(0,0,0,.7); }
#banner.boss .b1 { color: #F2A38F; }
#toasts { position: absolute; top: 62px; left: 10px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; pointer-events: none; max-width: min(420px, calc(100% - 20px)); }
.toast { background: rgba(28,35,30,.95); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 7px 14px; font-weight: 600; animation: tin .25s; }
.toast.bad { border-color: #8C3B2E; color: #F4B6A6; }
.toast.good { border-color: #8C6A2A; color: var(--gold-hi); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }

.overlay { position: absolute; inset: 0; background: rgba(12,16,13,.72); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal { background: var(--loam-2); border: 1px solid var(--line); border-radius: 14px; padding: 26px 30px; width: min(520px, 100%); max-height: 100%; overflow: auto; }
.modal h2 { font-family: var(--font-display); font-weight: 400; font-size: 42px; margin: 0 0 4px; color: var(--parch); line-height: 1; }
.modal p { color: var(--parch-dim); margin: 8px 0 16px; max-width: 60ch; }
.modal .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.modal dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; margin: 12px 0; font-variant-numeric: tabular-nums; }
.modal dt { color: var(--parch-dim); } .modal dd { margin: 0; text-align: right; font-weight: 700; }
.modal label.set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--loam-3); }
.modal select { background: var(--loam-3); color: var(--parch); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
.modal ul { margin: 6px 0 0; padding-left: 20px; color: var(--parch-dim); } .modal li { margin: 5px 0; }
.modal li b { color: var(--parch); }

#title { background: radial-gradient(ellipse at 50% 35%, rgba(28,35,30,.25), rgba(12,16,13,.86) 70%); }
#title .wordmark { font-family: var(--font-display); font-size: clamp(56px, 11vw, 120px); line-height: .9; color: var(--parch);
  text-shadow: 0 4px 0 rgba(0,0,0,.45), 0 0 40px rgba(88,196,184,.25); text-align: center; }
#title .sub { text-align: center; color: var(--gold-hi); font-size: 20px; margin-top: 6px; }
#title .tag { text-align: center; color: var(--parch-dim); margin: 18px auto 26px; max-width: 46ch; }
#title .row { justify-content: center; }

#camchip { position: absolute; top: 62px; left: 50%; transform: translateX(-50%); background: rgba(28,35,30,.92); border: 1px solid var(--teal); color: var(--teal);
  border-radius: 999px; padding: 5px 14px; font-weight: 700; font-size: 14px; pointer-events: none; z-index: 4; }
#act-btn.on { border-color: var(--teal); color: var(--teal); }
#perf { position: absolute; right: 10px; top: 140px; background: rgba(0,0,0,.72); color: #D9F2E9; font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace;
  padding: 6px 9px; border-radius: 6px; white-space: pre; pointer-events: none; z-index: 5; }
#pausebtn { position: absolute; top: 10px; right: 350px; }

/* ---------- small screens / phone-size (responsive rules only; full phone QA is a later milestone) ---------- */
@media (max-width: 900px) {
  #board { width: 240px; font-size: 12.5px; } #board th:nth-child(5), #board td:nth-child(5), #board th:nth-child(6), #board td:nth-child(6) { display: none; }
  #hud-top { max-width: calc(100% - 260px); } #pausebtn { right: 258px; }
  .card { min-width: 0; }
}
@media (max-width: 640px) {
  #hud-top { max-width: calc(100% - 84px); gap: 6px; top: 8px; left: 8px; } .chip { font-size: 15px; padding: 4px 9px; min-height: 36px; }
  #pausebtn { right: 8px; top: 8px; }
  #board { top: 150px; right: 8px; width: auto; min-width: 150px; } #board .title { font-size: 16px; padding: 4px 8px; gap: 8px; }
  #board .long, #ov-btn .long { display: none; } #board .short, #ov-btn .short { display: inline; }
  #board th:nth-child(n+4), #board td:nth-child(n+4) { display: none; } #board td[colspan] { display: table-cell; font-size: 12px; }
  #cam { bottom: auto; top: 102px; left: 8px; flex-direction: row; width: auto; } #plot-select, #home-btn span, #minimap { display: none; }
  #cam .row { gap: 4px; } #cam button { padding: 4px 9px; }
  #dock { left: 8px; right: 8px; bottom: 8px; transform: none; max-width: none; gap: 6px; align-items: flex-end; }
  #roll-panel { min-width: 0; padding: 6px; } .big { font-size: 16px; padding: 8px 10px; }
  #offer-panel, #sel-panel { flex: 1; min-width: 0; padding: 8px; }
  .card { grid-template-columns: 40px 1fr; min-width: 0; max-width: none; gap: 2px 8px; } .card .glyph { width: 40px; height: 40px; grid-row: span 2; } .card .glyph svg { width: 24px; height: 24px; }
  .card .name { font-size: 15px; } .card .ability { grid-column: span 2; font-size: 12.5px; }
  #sel-panel .stats { display: none; }
  .actions { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; } .actions .btn { flex: none; font-size: 13.5px; }
  #toasts { top: 150px; left: 50%; transform: translateX(-50%); align-items: center; width: calc(100% - 24px); } .toast { font-size: 14px; }
  #banner { top: 20%; } .modal { padding: 20px; } .modal h2 { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) { .toast, .chip.lives.hurt { animation: none; } #banner { transition: none; } }
/* selection panel: fixed slots (buttons never move), soft "can't afford yet" state instead of flashing disabled */
.actions.slots { display: grid; grid-template-columns: auto auto; gap: 6px; align-items: center; }
.btn.short { opacity: .55; }
.btn.confirm, .linkbtn.confirm { background: #6A2A22; border-color: #E0604A; color: #FFD6CC; }
.gamble.off { opacity: .4; }
.abil-row { grid-column: span 2; display: flex; align-items: center; gap: 8px; }
.linkbtn { background: none; border: 1px solid transparent; border-radius: 6px; padding: 1px 7px; font-size: 12.5px; font-weight: 700; color: #F0A393; cursor: pointer; }
.linkbtn:hover { border-color: #8C3B2E; }

#setbtn { position: absolute; top: 10px; right: 432px; }
.setnote { font-size: 13.5px; color: var(--parch-dim); margin: 8px 0 0; }
.toast.offer { pointer-events: auto; display: flex; align-items: center; gap: 10px; border-color: #8C6A2A; }
@media (max-width: 900px) { #setbtn { right: 340px; } }
@media (max-width: 640px) { #setbtn { right: 84px; top: 8px; } }

/* camera rotate / tilt pad */
#camrot { position: absolute; right: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(4, 44px); gap: 6px; z-index: 5; }
#camrot button { width: 44px; height: 44px; border-radius: 50%; background: rgba(28,35,30,.88); border: 1px solid var(--line); color: var(--parch);
  display: grid; place-items: center; padding: 0; touch-action: none; -webkit-user-select: none; user-select: none; cursor: pointer; }
#camrot button:hover, #camrot button:active { border-color: var(--teal); color: var(--teal); }
#camrot svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 640px) {
  #camrot { right: 8px; bottom: auto; top: 200px; grid-template-columns: 44px; }
}
</style></head>

<script>/* Arcane Hand: Horde Defense — authoritative simulation.
   Pure data + systems. No rendering, no DOM, no wall-clock, no Math.random.
   Runs identically in Node (harness) and the browser. Fixed 30 Hz tick. */
(function (root) {
'use strict';

const TICK_HZ = 30, DT = 1 / TICK_HZ;

// ---------------------------------------------------------------- RNG
function hashStr(s, seed) {
  let h = (seed ^ 0x9e3779b9) >>> 0;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 0x85ebca6b); h = (h ^ (h >>> 13)) >>> 0; }
  return h >>> 0;
}
class Rng {
  constructor(seed) { this.s = seed >>> 0; }
  next() {

    let t = Math.imul(a ^ (a >>> 15), 1 | a);

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(n) { return Math.floor(this.next() * n); }

  grove: { bolt: 'Thorn Post', sniper: 'Longbark', rapid: 'Bramble Nest', heavy: 'Oaken Ram' },

  [{ t: 'bulwark', n: 14, gap: 1.0 }, { t: 'grub', n: 14, gap: 0.6 }],
  [{ t: 'wisp', n: 18, gap: 0.7 }, { t: 'grub', n: 10, gap: 0.6 }, { t: 'wisp', n: 2, gap: 1.5, elite: 'ward' }],
  [{ t: 'troll', n: 8, gap: 1.6 }, { t: 'skitter', n: 40, gap: 0.2 }],
  [{ t: 'knight', n: 14, gap: 0.9 }, { t: 'budling', n: 12, gap: 0.9 }],
  [{ t: 'dasher', n: 20, gap: 0.4 }, { t: 'bulwark', n: 8, gap: 0.9, elite: 'frenzy' }, { t: 'wisp', n: 12, gap: 0.5 }],
  [{ t: 'skitter', n: 60, gap: 0.12 }, { t: 'troll', n: 6, gap: 1.2 }, { t: 'knight', n: 10, gap: 0.7 }, { t: 'wisp', n: 16, gap: 0.4 }],
  [{ t: 'grub', n: 20, gap: 0.5 }, { t: 'boss', n: 1, gap: 1 }, { t: 'knight', n: 8, gap: 1.2, elite: 'frenzy' }],
];
const WAVE_NAMES = ['First Crawl', 'The Swarm', 'Quickfeet', 'Iron Hides', 'Wings Over the Glade',
  'The Mending Ones', 'Shields and Seeds', 'Frenzied March', 'The Deluge', 'The Vault Breaker'];

function hpMul(w) { const k = w - 1; return 1 + TUNE.hpA * k + TUNE.hpB * k * k; }

// ---------------------------------------------------------------- map
const W = 22, H = 14;
const PATH_WP = [[0, 1], [19, 1], [19, 4], [2, 4], [2, 7], [19, 7], [19, 10], [2, 10], [2, 12], [21, 12]];
const RIVER_X = 11;
function buildMap() {
  const kind = new Uint8Array(W * H); // 0 build, 1 path, 2 river, 3 vault
  const order = [];
  for (let i = 0; i < PATH_WP.length - 1; i++) {
    const [ax, az] = PATH_WP[i], [bx, bz] = PATH_WP[i + 1];
    const sx = Math.sign(bx - ax), sz = Math.sign(bz - az);
    let x = ax, z = az;
    while (true) {
      const idx = z * W + x;
      if (!kind[idx]) { kind[idx] = 1; order.push(idx); }
      if (x === bx && z === bz) break;
      x += sx; z += sz;
    }
  }
  for (let z = 0; z < H; z++) { const idx = z * W + RIVER_X; if (!kind[idx]) kind[idx] = 2; }
  const vault = order[order.length - 1];
  kind[vault] = 3;
  // reverse BFS distance field from the vault over walkable tiles (path + vault)
  const dist = new Int32Array(W * H).fill(-1);
  const q = [vault]; dist[vault] = 0;
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi], cx = c % W, cz = (c / W) | 0;
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, nz = cz + dz;
      if (nx < 0 || nz < 0 || nx >= W || nz >= H) continue;
      const n = nz * W + nx;
      if (dist[n] >= 0 || (kind[n] !== 1 && kind[n] !== 3)) continue;
      dist[n] = dist[c] + 1; q.push(n);
    }
  }
  // cached flow direction: next tile toward the vault (shared by every monster)
  const next = new Int32Array(W * H).fill(-1);
  for (let i = 0; i < W * H; i++) {
    if (dist[i] <= 0) continue;
    const cx = i % W, cz = (i / W) | 0;
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, nz = cz + dz;
      if (nx < 0 || nz < 0 || nx >= W || nz >= H) continue;
      const n = nz * W + nx;
      if (dist[n] === dist[i] - 1) { next[i] = n; break; }
    }
  }
  const spawn = order[0];
  return { W, H, kind, dist, next, spawn, vault, order, pathLen: dist[spawn], riverX: RIVER_X };
}

// ---------------------------------------------------------------- simulation
const CAP = 6144;
const F_FLY = 1, F_BOSS = 2, F_ELITE = 4, F_FRENZY = 8, F_SPLIT = 16;

class Sim {
  constructor(opts = {}) {
    this.seed = (opts.seed >>> 0) || 1;
    this.opts = opts;
    this.map = buildMap();
    this.reset();
  }

  reset() {
    const s = this.seed;
    this.rng = {
      roll: new Rng(hashStr('roll', s)), merge: new Rng(hashStr('merge', s)),
      ability: new Rng(hashStr('ability', s)), wave: new Rng(hashStr('wave', s)),
      combat: new Rng(hashStr('combat', s)),
    };
    this.tick = 0;
    this.phase = 'build';           // build | wave | victory | defeat
    this.countdown = this.opts.firstCountdown != null ? this.opts.firstCountdown : 45;
    this.waveIdx = 0;               // index of the NEXT wave to start (0-based)
    this.endless = false;
    this.players = [{ id: 0, name: 'You', gold: COST.startGold, lives: 20, score: 0, leaked: 0, bossKills: 0, kills: 0,
      rolls: 0, addRandomUses: 0, addTargetUses: 0, merges: 0, gambles: 0, gambleHits: 0 }];
    this.plotOwner = 0;             // the single plot in the solo slice is owned by player 0
    this.offer = null;
    this.towers = []; this.towerById = new Map(); this.towerAt = new Int32Array(W * H).fill(-1);
    this.nextTowerId = 1;
    this.events = [];
    this.stats = { navRecoveries: 0, maxAlive: 0, spawned: 0, dmgByElement: {}, dmgByAbility: {}, killsByTower: {},
      overruns: 0, simMs: 0 };
    for (const e of ELEMENTS) this.stats.dmgByElement[e] = 0;
    // monster pool (structure of arrays)
    const f = () => new Float32Array(CAP);
    this.m = {
      alive: new Uint8Array(CAP), type: new Uint8Array(CAP), flags: new Uint8Array(CAP), gen: new Uint32Array(CAP),
      x: f(), z: f(), px: f(), pz: f(), hp: f(), maxHp: f(), armor: f(), shield: f(), maxShield: f(),
      speed: f(), lane: f(), tile: new Int32Array(CAP), key: f(), slowT: f(), burnT: f(), burnDps: f(),
      shredT: f(), immune: new Int8Array(CAP), reward: f(), leak: new Uint8Array(CAP), hitT: f(),
      lastKey: f(), stuckT: f(), frenzyBoost: new Uint8Array(CAP), bossPhase: new Uint8Array(CAP), enrage: f(),
      dirx: f(), dirz: f(), burnSrc: new Int32Array(CAP),
    };
    this.m.immune.fill(-1);
    this.free = []; for (let i = CAP - 1; i >= 0; i--) this.free.push(i);
    this.alive = 0; this.aliveList = new Int32Array(CAP); this.aliveN = 0;
    this.schedule = []; this.schedIdx = 0; this.waveTime = 0;
    this.cellStart = new Int32Array(W * H + 1); this.cellItems = new Int32Array(CAP);
    this.telegraphs = [];
    this.stressN = this.opts.stress | 0;
    if (this.stressN) { this.phase = 'wave'; this.countdown = 0; }
  }

  get player() { return this.players[0]; }

  // ------------------------------------------------ actions (owner-scoped, validated)
  apply(a) {
    const r = this._apply(a);
    if (!r.ok) this.events.push({ t: 'reject', reason: r.reason, action: a.type });
    return r;
  }
  _apply(a) {
    if (!a || typeof a.type !== 'string') return { ok: false, reason: 'bad action' };
    if (a.owner !== this.plotOwner) return { ok: false, reason: 'You can only act on your own plot.' };
    const p = this.players[a.owner];
    if (this.phase === 'victory' || this.phase === 'defeat') {
      if (a.type !== 'continueEndless') return { ok: false, reason: 'The run is over.' };
    }
    const tower = a.id != null ? this.towers.find(t => t.id === a.id) : null;
    if (a.id != null && (!tower || tower.owner !== a.owner)) return { ok: false, reason: 'That tower is not yours.' };
    switch (a.type) {
      case 'roll': case 'reroll': {
        if (a.type === 'roll' && this.offer) return { ok: false, reason: 'Place or sell your rolled tower first.' };
        if (a.type === 'reroll' && !this.offer) return { ok: false, reason: 'Nothing to reroll.' };
        const cost = COST.roll(p.rolls);
        if (p.gold < cost) return { ok: false, reason: `Need ${cost} gold to roll.` };
        p.gold -= cost; p.rolls++;
        this.offer = this._rollTower(cost);
        this.events.push({ t: 'roll', tier: this.offer.tier, el: this.offer.el });
        return { ok: true };
      }
      case 'sellOffer': {
        if (!this.offer) return { ok: false, reason: 'Nothing to sell.' };
        p.gold += Math.floor(this.offer.paid * COST.sellFraction); this.offer = null;
        return { ok: true };
      }
      case 'place': {
        if (!this.offer) return { ok: false, reason: 'Roll a tower first.' };
        if (!this.canBuild(a.tx, a.tz)) return { ok: false, reason: 'You can’t build there.' };
        const o = this.offer; this.offer = null;
        const t = this._makeTower(a.owner, a.tx, a.tz, o.el, o.arch, o.tier, o.ability, o.paid);
        this.events.push({ t: 'place', id: t.id });
        return { ok: true, id: t.id };
      }
      case 'sellTower': {
        if (!tower) return { ok: false, reason: 'Select a tower.' };
        if (tower.locked) return { ok: false, reason: 'Unlock it before selling.' };
        p.gold += Math.floor(tower.invested * COST.sellFraction);
        this._removeTower(tower); this._recomputeAura();
        this.events.push({ t: 'sell', x: tower.x, z: tower.z });
        return { ok: true };
      }
      case 'lock': {
        if (!tower) return { ok: false, reason: 'Select a tower.' };
        tower.locked = !tower.locked; return { ok: true };
      }
      case 'merge': {
        if (!tower) return { ok: false, reason: 'Select a tower.' };
        if (tower.tier >= 4) return { ok: false, reason: 'Legendary towers can’t merge further.' };
        const partners = this.mergePartners(tower);
        if (!partners.length) return { ok: false, reason: `You need another unlocked ${TIERS[tower.tier]} tower.` };
        const gamble = !!a.gamble && tower.tier + 2 <= 4;
        const cost = COST.merge[tower.tier] + (gamble ? COST.gamble : 0);
        if (p.gold < cost) return { ok: false, reason: `Need ${cost} gold to merge.` };
        p.gold -= cost; p.merges++;
        const partner = partners[this.rng.merge.int(partners.length)];
        let up = 1;
        if (gamble) { p.gambles++; if (this.rng.merge.next() < COST.gambleChance) { up = 2; p.gambleHits++; } }
        const newTier = tower.tier + up;
        // 3–5 hidden possibilities: the two input elements x archetypes
        const pool = [];
        const els = tower.el === partner.el ? [tower.el] : [tower.el, partner.el];
        const archs = tower.arch === partner.arch ? [tower.arch, ARCHES[(ARCHES.indexOf(tower.arch) + 1) % 4], ARCHES[(ARCHES.indexOf(tower.arch) + 2) % 4]]
          : [tower.arch, partner.arch];
        for (const e of els) for (const ar of archs) pool.push([e, ar]);
        while (pool.length > 5) pool.pop();
        const [el, arch] = pool[this.rng.merge.int(pool.length)];
        // ability inheritance: only if BOTH inputs carried one; then rolled fresh
        let ability = null;
        if (tower.ability && partner.ability) ability = ABILITIES[this.rng.merge.int(ABILITIES.length)];
        const tx = tower.tx, tz = tower.tz, invested = tower.invested + partner.invested + cost;
        this._removeTower(tower); this._removeTower(partner);
        const nt = this._makeTower(a.owner, tx, tz, el, arch, newTier, ability, invested);
        this._recomputeAura();
        this.events.push({ t: 'merge', id: nt.id, from: [tower.id, partner.id], px: partner.x, pz: partner.z, jump: up, tier: newTier });
        return { ok: true, id: nt.id, jump: up, consumed: partner.id };
      }
      case 'addAbilityRandom': {
        const elig = this.towers.filter(t => t.owner === a.owner && !t.ability);
        if (!elig.length) return { ok: false, reason: 'Every tower already has an ability.' };
        const cost = COST.addRandom(p.addRandomUses);
        if (p.gold < cost) return { ok: false, reason: `Need ${cost} gold.` };
        p.gold -= cost; p.addRandomUses++;
        const t = elig[this.rng.ability.int(elig.length)];
        t.ability = ABILITIES[this.rng.ability.int(ABILITIES.length)];
        this._recomputeAura();
        this.events.push({ t: 'enchant', id: t.id, ability: t.ability });
        return { ok: true, id: t.id, ability: t.ability };
      }
      case 'addAbilityTarget': {
        if (!tower) return { ok: false, reason: 'Select a tower.' };
        if (tower.ability) return { ok: false, reason: 'Drop its ability first.' };
        const cost = COST.addTarget(p.addTargetUses);
        if (p.gold < cost) return { ok: false, reason: `Need ${cost} gold.` };
        p.gold -= cost; p.addTargetUses++;
        tower.ability = ABILITIES[this.rng.ability.int(ABILITIES.length)];
        this._recomputeAura();
        this.events.push({ t: 'enchant', id: tower.id, ability: tower.ability });
        return { ok: true, id: tower.id, ability: tower.ability };
      }
      case 'dropAbility': {
        if (!tower) return { ok: false, reason: 'Select a tower.' };
        if (!tower.ability) return { ok: false, reason: 'It has no ability.' };
        tower.ability = null; this._recomputeAura(); return { ok: true };
      }
      case 'startWave': {
        if (this.phase !== 'build') return { ok: false, reason: 'A wave is already running.' };
        this.countdown = 0; return { ok: true };
      }
      case 'continueEndless': {
        if (this.phase !== 'victory') return { ok: false, reason: 'Only after victory.' };
        this.endless = true; this.phase = 'build'; this.countdown = 30; return { ok: true };
      }
    }
    return { ok: false, reason: 'unknown action' };
  }

  canBuild(tx, tz) {
    if (!(tx >= 0 && tz >= 0 && tx < W && tz < H) || tx !== (tx | 0) || tz !== (tz | 0)) return false;
    const i = tz * W + tx;
    return this.map.kind[i] === 0 && this.towerAt[i] < 0;
  }
  mergePartners(t) { return this.towers.filter(o => o !== t && o.owner === t.owner && o.tier === t.tier && !o.locked); }
  rollCost() { return COST.roll(this.player.rolls); }
  mergeCost(t, gamble) { return COST.merge[t.tier] + (gamble && t.tier + 2 <= 4 ? COST.gamble : 0); }

  _rollTower(paid) {
    const r = this.rng.roll;
    let x = r.next(), tier = 0;
    for (let i = 0; i < 5; i++) { if (x < ROLL_ODDS[i]) { tier = i; break; } x -= ROLL_ODDS[i]; tier = i; }
    const el = r.pick(ELEMENTS), arch = r.pick(ARCHES);
    const ability = r.next() < ROLL_ABILITY_CHANCE ? r.pick(ABILITIES) : null;
    return { el, arch, tier, ability, paid, name: NAMES[el][arch] };
  }
  _makeTower(owner, tx, tz, el, arch, tier, ability, invested) {
    const a = ARCH[arch], e = ELEM[el];
    const t = { id: this.nextTowerId++, owner, tx, tz, x: tx + 0.5, z: tz + 0.5, el, arch, tier, ability, locked: false,
      name: NAMES[el][arch], dmg: a.dmg * e.dmg * TIER_DMG[tier], rate: a.rate * e.rate * (1 + 0.05 * tier),
      range: a.range + 0.25 * tier, cd: 0.3, invested, auraBoost: 1, dmgDone: 0, kills: 0, placedTick: this.tick };
    this.towers.push(t); this.towerById.set(t.id, t); this.towerAt[tz * W + tx] = t.id;
    this._recomputeAura();
    return t;
  }
  _removeTower(t) {
    const i = this.towers.indexOf(t); if (i >= 0) this.towers.splice(i, 1); this.towerById.delete(t.id);
    this.towerAt[t.tz * W + t.tx] = -1;
  }
  _recomputeAura() {
    for (const t of this.towers) t.auraBoost = 1;
    for (const a of this.towers) if (a.ability === 'aura')
      for (const t of this.towers) if (t !== a && Math.hypot(t.x - a.x, t.z - a.z) <= 2.3) t.auraBoost = 1.25;
  }

  // ------------------------------------------------ waves
  _buildSchedule(w) {
    const def = w < WAVES.length ? WAVES[w] : this._endlessWave(w);
    const list = []; const r = this.rng.wave;
    def.forEach((g, gi) => {
      const ward = g.elite === 'ward' ? r.int(ELEMENTS.length) : -1;
      for (let k = 0; k < g.n; k++) list.push({ time: gi * 4 + k * g.gap, type: g.t, elite: g.elite || null, ward });
    });
    list.sort((a, b) => a.time - b.time || MT_KEYS.indexOf(a.type) - MT_KEYS.indexOf(b.type));
    return list;
  }
  _endlessWave(w) {
    const r = this.rng.wave, pool = ['grub', 'skitter', 'dasher', 'bulwark', 'troll', 'wisp', 'knight', 'budling'];
    const g = [];
    for (let i = 0; i < 3; i++) { const t = r.pick(pool); g.push({ t, n: t === 'skitter' ? 40 : 14, gap: t === 'skitter' ? 0.15 : 0.6, elite: r.next() < 0.3 ? (r.next() < 0.5 ? 'ward' : 'frenzy') : undefined }); }
    if ((w + 1) % 5 === 0) g.push({ t: 'boss', n: 1, gap: 1 });
    return g;
  }
  waveName(w) { return w < WAVE_NAMES.length ? WAVE_NAMES[w] : `Endless ${w + 1}`; }
  waveTotal() { return WAVES.length; }

  spawn(type, elite, ward, atTile, atX, atZ) {
    if (!this.free.length) return -1;
    const i = this.free.pop(), m = this.m, d = MT[type], ti = MT_KEYS.indexOf(type);
    const w = Math.max(1, this.stressN ? 3 : this.waveIdx);
    let hp = d.hp * hpMul(w) * (elite ? 2.5 : 1);
    m.alive[i] = 1; m.type[i] = ti; m.gen[i]++;
    m.flags[i] = (d.flying ? F_FLY : 0) | (d.boss ? F_BOSS : 0) | (elite ? F_ELITE : 0) | (elite === 'frenzy' ? F_FRENZY : 0) | (d.split ? F_SPLIT : 0);
    m.hp[i] = m.maxHp[i] = hp; m.armor[i] = d.armor + (w > 6 ? 1 : 0);
    m.shield[i] = m.maxShield[i] = (d.shield || 0) * hpMul(w);
    m.speed[i] = d.speed; m.reward[i] = d.reward * TUNE.rewardMul * (1 + 0.06 * (w - 1)) * (elite ? 3 : 1);
    m.leak[i] = d.leak * (elite ? 2 : 1);
    m.immune[i] = ward >= 0 ? ward : -1;
    m.lane[i] = (this.rng.wave.next() - 0.5) * (d.boss ? 0 : 0.5);
    m.slowT[i] = m.burnT[i] = m.burnDps[i] = m.shredT[i] = m.hitT[i] = 0;
    m.stuckT[i] = 0; m.bossPhase[i] = 0; m.enrage[i] = 1; m.frenzyBoost[i] = 0;
    const map = this.map;
    if (atTile != null) {
      m.tile[i] = atTile; m.x[i] = atX; m.z[i] = atZ;
    } else {
      const sx = map.spawn % W, sz = (map.spawn / W) | 0;
      m.tile[i] = map.spawn; m.x[i] = sx - 0.6; m.z[i] = sz + 0.5 + m.lane[i];
    }
    m.px[i] = m.x[i]; m.pz[i] = m.z[i];
    m.dirx[i] = 1; m.dirz[i] = 0;
    m.key[i] = m.lastKey[i] = map.dist[m.tile[i]] + 1;
    this.alive++; this.stats.spawned++;
    if (this.alive > this.stats.maxAlive) this.stats.maxAlive = this.alive;
    return i;
  }

  _kill(i, byTower) {
    const m = this.m, p = this.player;
    m.alive[i] = 0; this.alive--; this.free.push(i);
    const type = MT_KEYS[m.type[i]];
    if (!this.stressN) {
      p.gold += Math.round(m.reward[i]); p.kills++; p.score += Math.round(m.reward[i] * 10);
      if (m.flags[i] & F_BOSS) { p.bossKills++; p.score += 5000; }
    }
    if (byTower) byTower.kills++;
    this.events.push({ t: 'death', i, x: m.x[i], z: m.z[i], type, boss: !!(m.flags[i] & F_BOSS), elite: !!(m.flags[i] & F_ELITE) });
    if (m.flags[i] & F_SPLIT) {
      const d = MT[type];
      for (let k = 0; k < d.splitN; k++) {
        const j = this.spawn(d.split, null, -1, m.tile[i], m.x[i] + (k - 1) * 0.15, m.z[i] + (k - 1) * 0.15);
        if (j >= 0) m.lane[j] = (k - 1) * 0.2;
      }
    }
  }

  // ------------------------------------------------ the fixed tick
  step() {
    const m = this.m, map = this.map, p = this.player;
    this.tick++;
    // phase control
    if (this.phase === 'build') {
      this.countdown -= DT;
      if (this.countdown <= 0) this._startWave();
    }
    if (this.phase === 'wave') {
      this.waveTime += DT;
      if (this.stressN) {
        while (this.alive < this.stressN && this.free.length) {
          const types = ['grub', 'skitter', 'dasher', 'bulwark', 'wisp', 'knight', 'troll'];
          const i = this.spawn(types[this.stats.spawned % types.length], this.stats.spawned % 53 === 0 ? 'ward' : null, 1);
          // spread them along the whole path so the benchmark is a real crowd
          if (i >= 0) this._placeAlongPath(i, (this.stats.spawned * 0.61803) % 1);
        }
      } else {
        while (this.schedIdx < this.schedule.length && this.schedule[this.schedIdx].time <= this.waveTime) {
          const s = this.schedule[this.schedIdx++];
          this.spawn(s.type, s.elite, s.ward);
        }
      }
    }
    // alive list (stable order by pool index keeps iteration deterministic)
    let n = 0;
    for (let i = 0; i < CAP; i++) if (m.alive[i]) this.aliveList[n++] = i;
    this.aliveN = n;
    const list = this.aliveList;

    // frenzy auras (5 Hz)
    if (this.tick % 6 === 0) {
      for (let k = 0; k < n; k++) m.frenzyBoost[list[k]] = 0;
      for (let k = 0; k < n; k++) { const i = list[k]; if (!(m.flags[i] & F_FRENZY)) continue;
        for (let q = 0; q < n; q++) { const j = list[q]; const dx = m.x[j] - m.x[i], dz = m.z[j] - m.z[i]; if (dx * dx + dz * dz < 4) m.frenzyBoost[j] = 1; } }
    }

    // movement + status (every tick)
    for (let k = 0; k < n; k++) {
      const i = list[k];
      m.px[i] = m.x[i]; m.pz[i] = m.z[i];
      if (m.hitT[i] > 0) m.hitT[i] -= DT;
      if (m.slowT[i] > 0) m.slowT[i] -= DT;

  const crystal = new THREE.MeshStandardMaterial({ color: lin(0x7FF6E6), emissive: lin(0x3FE8D0), emissiveIntensity: 2.4, roughness: 0.15, flatShading: true });

  if (bannerT > 0) { bannerT -= (dt || 1 / 60); if (bannerT <= 0) $('#banner').classList.remove('show'); }
  if (postOn) post.render(scene, camera); else renderer.render(scene, camera);
  if (now - ui.lastUi > 100) { ui.lastUi = now; updateUI(); drawMinimap(); } // non-critical UI at 10 Hz
  const perf = $('#perf'); perf.classList.toggle('hidden', !settings.showPerf);
  if (settings.showPerf) { const ri = renderer.info.render; const ws = worst.slice().sort((a, b) => b - a); const w1 = ws[Math.floor(ws.length * 0.01)] || 0;
    perf.textContent = `fps ${fpsShow.toFixed(0)}  worst1% ${w1.toFixed(1)}ms\nsim ${simMs.toFixed(2)}ms/tick  overruns ${sim.stats.overruns}\nunits ${sim.alive} (drawn ${sim.alive - CRE.stats.culled}, full-detail ${CRE.stats.hi})  towers ${sim.towers.length}\ndraws ${ri.calls}  tris ${(ri.triangles / 1000).toFixed(0)}k\nquality ${QL}  cut ${cosmeticCut()}  res ${(renderer.getPixelRatio()).toFixed(2)}\nfx ${FXS.count()}  seed ${seed}`; }
}
function showRange(x, z, r, col) { rangeRing.visible = rangeFill.visible = true; rangeRing.position.set(x, 0.06, z); rangeRing.scale.set(r, r, 1); rangeFill.position.set(x, 0.055, z); rangeFill.scale.set(r, r, 1);
  rangeRing.material.color.copy(lin(col)).multiplyScalar(1.6); rangeFill.material.color.copy(lin(col)); }

// ------------------------------------------------------------------ in-page bot (for ?auto demo and the visual harness)
let botAct = null;
if (Q.has('auto') && AH.BasicBot) { const b = new AH.BasicBot(sim, seed); botAct = (t) => b.act(t); }

// ------------------------------------------------------------------ boot
if (innerWidth <= 640) { $('#board').classList.add('collapsed'); $('#board-toggle').textContent = 'Show'; $('#board-toggle').setAttribute('aria-expanded', 'false'); }
applyQuality(QL); resize(); buildMinimap(); updateUI(true); fitCamera(); camHome(); snapCam();
if (!ui.started) titleScreen(); else if (sim.stressN) banner('Benchmark', `${sim.stressN} units on the field`); else if (!TEST) banner('The Verdant Vault', 'Roll your first tower, then place it beside the path.');
requestAnimationFrame(frame);

// test / harness hooks (deterministic stepping for reproducible checkpoint frames)
window.__ah = {
  get sim() { return sim; }, ui, settings, cam, act, updateUI, camHome, toast,
  step(n) { for (let k = 0; k < n; k++) { if (botAct) botAct(sim.tick); sim.step(); if (n - k > 30) { onEvents(sim.drainEvents()); FXS.update(1 / 30); CRE.age(1 / 30); drawRings(1 / 30); drawPillars(1 / 30); if (bannerT > 0 && (bannerT -= 1 / 30) <= 0) $('#banner').classList.remove('show'); } }
    if (n > 90) { [...$('#toasts').children].slice(0, -1).forEach(t => t.remove()); if (tele && sim.tick - tele.tick > (tele.dur + 0.2) * 30) tele = null; else if (tele) tele.t = (sim.tick - tele.tick) / 30; } },
  render(dtSec = 1 / 60) { now += dtSec * 1000; present(dtSec, 1); updateUI(true); drawMinimap(); },
  select(id) { ui.selected = id; updateUI(true); }, hover(tx, tz) { ui.hover = { tx, tz }; },
  project(x, y, z) { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; },
  towerTop(id) { const v = towerViews.get(id); return v ? v.g.userData.top : 0; }, pick(x, y) { return pickTower(x, y); }, pickOld(x, y) { const p = pickTile(x, y); return p && p.tx >= 0 && p.tz >= 0 && p.tx < W && p.tz < H ? sim.towerAt[p.tz * W + p.tx] || null : null; },
  setBot(on) { if (on && AH.BasicBot) { const b = new AH.BasicBot(sim, seed); botAct = (t) => b.act(t); } else botAct = null; },
  closeTitle() { closeOverlay('title'); ui.started = true; },
  camTo(x, z, d, pitch, yaw) { goal.tx = cam.tx = x; goal.tz = cam.tz = z; goal.dist = cam.dist = d; goal.pitch = cam.pitch = pitch != null ? pitch : pitchFor(d); if (yaw != null) goal.yaw = cam.yaw = yaw; },
  follow(i) { camX.follow = { type: 'mon', i, gen: sim.m.gen[i], name: 'x' }; }, action(on) { camX.action = on; camX.actionT = 99; },
  camHome() { camHome(); snapCam(); }, camOverview() { camOverview(); snapCam(); },
  debug: { get renderer() { return renderer; }, CRE, FXS, scene, sun, hemi, post },
  info() { return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, alive: sim.alive, towers: sim.towers.length, quality: QL }; },
};
})();
</script>
